{% extends "base.html" %}
{% block content %}
<div class="failed-container">
    <div class="failed-icon">❌</div>
    <h2>Ошибка при оплате</h2>

    <div class="error-info">
        <p>К сожалению, не удалось подтвердить вашу транзакцию.</p>
        <p>Возможные причины:</p>
        <ul>
            <li>Недостаточно средств на кошельке</li>
            <li>Проблемы с блокчейном</li>
            <li>Неверный ID транзакции</li>
        </ul>
    </div>

    <div class="actions">
        <a href="{{ url_for('payment_page', order_id=order.id) }}" class="btn btn-retry">Попробовать снова</a>
        <a href="{{ url_for('account') }}" class="btn btn-secondary">Вернуться в корзину</a>
    </div>
</div>

<style>
.failed-container {
    max-width: 600px;
    margin: 50px auto;
    text-align: center;
    padding: 30px;
}

.failed-icon {
    font-size: 80px;
    margin-bottom: 20px;
}

.error-info {
    background: #fff3f3;
    padding: 20px;
    border-radius: 8px;
    margin: 30px 0;
    border: 1px solid #ffcdd2;
}

.error-info ul {
    text-align: left;
    max-width: 400px;
    margin: 20px auto;
    list-style: disc;
    padding-left: 20px;
}

.actions {
    margin-top: 30px;
}

.btn {
    display: inline-block;
    padding: 12px 30px;
    text-decoration: none;
    border-radius: 5px;
    margin: 5px;
}

.btn-retry {
    background: #ff9800;
    color: white;
}

.btn-retry:hover {
    background: #e68900;
}

.btn-secondary {
    background: #757575;
    color: white;
}

.btn-secondary:hover {
    background: #616161;
}
</style>
{% endblock %}
