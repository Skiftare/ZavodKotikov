{% extends "base.html" %}
{% block content %}
<h2 class="page-title">Генератор котов</h2>
<p class="subtitle">Создайте своего уникального кота: выберите параметры — и увидите кота в окне предпросмотра.</p>

<div class="shop-layout">
    <!-- Превью -->
    <div class="preview card">
        <div class="preview-box">
            <img
                    src="{{ cat_img_url or url_for('static', filename='placeholder.png') }}"
                    alt="Предпросмотр кота"
                    class="preview-img"
            />
        </div>
    </div>

    <!-- Форма -->
    <form method="post" class="card form-card" id="cat-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="hidden" name="action" value="preview" id="action-field">

        <label>Имя кота</label>
        <input type="text" name="name" value="{{ form_data.name or '' }}" placeholder="Барсик" required>

        <label>Порода</label>
        <select name="breed" required>
            {% set b = form_data.breed %}
            <option value="Британец" {{
            'selected' if b=='Британец' else '' }}>Британец</option>
            <option value="Сиамская" {{
            'selected' if b=='Сиамская' else '' }}>Сиамская</option>
            <option value="Персидская" {{
            'selected' if b=='Персидская'else '' }}>Персидская</option>
            <option value="Сфинкс" {{
            'selected' if b=='Сфинкс' else '' }}>Сфинкс</option>
        </select>

        <label>Цвет</label>
        <select name="color" required>
            {% set c = form_data.color %}
            <option value="Черный" {{
            'selected' if c=='Черный' else '' }}>Черный</option>
            <option value="Белый" {{
            'selected' if c=='Белый' else '' }}>Белый</option>
            <option value="Серый" {{
            'selected' if c=='Серый' else '' }}>Серый</option>
            <option value="Бежевый" {{
            'selected' if c=='Бежевый'else '' }}>Бежевый</option>
        </select>

        <label>Ушки</label>
        <select name="ears" required>
            {% set e = form_data.ears %}
            <option value="Острые в разные стороны" {{
            'selected' if e=='Острые в разные стороны' else '' }}>Острые в разные стороны</option>
            <option value="Круглые" {{
            'selected' if e=='Круглые' else '' }}>Круглые</option>
            <option value="Скругленные" {{
            'selected' if e=='Скругленные' else '' }}>Скругленные</option>
        </select>
        <label>Лапки</label>
        <select name="paws" required>
            {% set p = form_data.paws %}
            <option value="В цвет" {{
            'selected' if p=='В цвет' else '' }}>В цвет</option>
            <option value="Белые лапки" {{
            'selected' if p=='Белые лапки' else '' }}>Белые лапки</option>
        </select>

        <label>Рисунок</label>
        <select name="pattern" required>
            {% set pt = form_data.pattern %}
            <option value="Обычная" {{
            'selected' if pt=='Обычная' else '' }}>Обычная</option>
            <option value="Пятнышки" {{
            'selected' if pt=='Пятнышки' else '' }}>Пятнышки</option>
            <option value="Пятнышки с сердечком" {{
            'selected' if pt=='Пятнышки с сердечком' else '' }}>Пятнышки с сердечком</option>
            <option value="Полоски на хвосте" {{
            'selected' if pt=='Полоски на хвосте' else '' }}>Полоски на хвосте</option>
            <option value="Стая птиц" {{
            'selected' if pt=='Стая птиц' else '' }}>Стая птиц</option>
            <option value="Маска" {{
            'selected' if pt=='Маска' else '' }}>Маска</option>
            <option value="Воришка" {{
            'selected' if pt=='Воришка' else '' }}>Воришка</option>
        </select>

        <label>Контейнер</label>
        <select name="container" required>
            {% set ct = form_data.container %}
            <option value="Без контейнера" {{
            'selected' if ct=='Без контейнера' else '' }}>Без контейнера</option>
            <option value="В контейнере" {{
            'selected' if ct=='В контейнере' else '' }}>В контейнере</option>
        </select>

        <!-- НЕИЗМЕНЯЕМАЯ ЦЕНА -->
        <div class="price-box" aria-live="polite">
            <div class="price-label">Стоимость</div>
            <div class="price-value">{{ price }}</div>
        </div>


        <div class="actions">
            <button type="submit"
                    class="btn btn--block btn--lg"
                    name="action" value="add"
                    onclick="document.getElementById('action-field').value='add'">
                Добавить в корзину
            </button>
        </div>
    </form>
</div>

<script>
  (function () {
    const form = document.getElementById('cat-form');
    const previewImg = document.querySelector('.preview-img');
    const priceEl = document.querySelector('.price-value');

    function updatePreviewAndPrice() {
      const params = new URLSearchParams({
        breed: form.elements['breed'].value,
        color: form.elements['color'].value,
        ears: form.elements['ears'].value,
        paws: form.elements['paws'].value,
        container: form.elements['container'].value,
        pattern: form.elements['pattern'].value,
      });

      // 1) обновляем картинку
      const imgBaseUrl = "{{ url_for('compose_cat') }}";
      previewImg.src = imgBaseUrl + "?" + params.toString();

      // 2) запрашиваем цену
      const priceUrl = "{{ url_for('api_price') }}";
      fetch(priceUrl + "?" + params.toString())
        .then(resp => resp.json())
        .then(data => {
          priceEl.textContent = data.formatted;
        })
        .catch(err => {
          console.error("Ошибка при получении цены:", err);
        });
    }

    // слушаем только select'ы
    form.querySelectorAll('select').forEach(el => {
      el.addEventListener('change', updatePreviewAndPrice);
    });

    // первый рендер при загрузке
    updatePreviewAndPrice();

    // запрет Enter в имени кота
    const nameInput = form.querySelector('input[name="name"]');
    nameInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') e.preventDefault();
    });
  })();
</script>

{% endblock %}
