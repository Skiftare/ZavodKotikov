<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{{ title }} | Завод котов</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="app-bar">
        <h1 class="logo">🐾 Завод котов</h1>
        <nav>
          <a href="{{ url_for('index') }}">Главная</a>
          <a href="{{ url_for('about') }}">О нас</a>
          <a href="{{ url_for('shop') }}">Конфигуратор</a>

          <!-- Новая кнопка Корзина -->
          <a href="{{ url_for('account') }}" class="cart-link">
            Корзина <span class="cart-badge">{{ (session.get('orders', [])|length) or 0 }}</span>
          </a>
        </nav>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <p>© 2025 Завод котов. Все права защищены.</p>
    </footer>
</body>
</html>
