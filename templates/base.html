<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{{ title }} | Завод котов</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='img/favicon.ico') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;500;700&display=swap" rel="stylesheet">
</head>

<body>
    <!-- Шапка-баннер -->
    <div class="header-banner">
        <a class="banner-link" href="{{ url_for('index') }}" aria-label="На главную">
            <img src="{{ url_for('static', filename='img/site-header.png') }}" alt="Завод котиков">
        </a>
    </div>

    <!-- Навигационная панель -->
    <header class="app-bar">
        <div class="nav-container">
            <a class="logo" href="{{ url_for('index') }}" aria-label="На главную">
            </a>

            <nav>
                <a href="{{ url_for('index') }}">Главная</a>
                <a href="{{ url_for('shop') }}">Конфигуратор</a>
                <a href="{{ url_for('account') }}" class="cart-link">
                    Корзина <span class="cart-badge">{{ (session.get('orders', [])|length) or 0 }}</span>
                </a>
            </nav>
        </div>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <p>© 2025 Завод котов. Никакие права не защищены.</p>
    </footer>

{% block scripts %}{% endblock %}

<script>
    // Скрипт автоматической прокрутки баннера
    window.addEventListener('load', function() {
        // Проверяем через Jinja, что мы НЕ на главной странице
        {% if request.endpoint != 'index' %}
            const banner = document.querySelector('.header-banner');
            if (banner) {
                // Прокручиваем на высоту баннера
                window.scrollTo(0, banner.offsetHeight);
            }
        {% endif %}
    });
</script>
</body>
</html>
