<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{{ title }} | Завод котов</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='img/favicon.ico') }}">
</head>

<body>
    <!-- Шапка-баннер -->
    <div class="header-banner">
        <a class="banner-link" href="{{ url_for('index') }}" aria-label="На главную">
            <img src="{{ url_for('static', filename='img/site-header.png') }}" alt="Завод котиков">
        </a>
    </div>

    <!-- Навигационная панель -->
    <header class="app-bar">
        <div class="nav-container">
            <a class="logo" href="{{ url_for('index') }}" aria-label="На главную">
                <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Завод котиков" height="28">
            </a>

            <nav>
                <a href="{{ url_for('index') }}">Главная</a>
                <a href="{{ url_for('shop') }}">Конфигуратор</a>
                <a href="{{ url_for('account') }}" class="cart-link">
                    Корзина <span class="cart-badge">{{ (session.get('orders', [])|length) or 0 }}</span>
                </a>
            </nav>
        </div>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <p>© 2025 Завод котов. Все права защищены.</p>
    </footer>

{% block scripts %}{% endblock %}
</body>
</html>
